<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2228" id="meta-theme">
<title>Stands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<!--
  STANDS · App para constructores de stands
  Versión: se define UNA sola vez en APP_VERSION (abajo) y de ahí sale a pantalla.
  v0.1.0 - 2026-10-13
    - Acceso con correo y contraseña, alta de empresa.
    - Clientes con canal de origen (lista editable por empresa).
    - Ajustes: apariencia (3 paletas + color propio), canales, datos de la empresa.
    - Pendiente: stands con 3 fases, catálogo, cotizador, instalación sin señal.
-->
<style>
  :root{
    --bg:#EDEFF1; --surface:#FFFFFF; --ink:#1C2228; --muted:#566170; --line:#D5DAE0;
    --accent:#C2410C; --accent-ink:#FFFFFF; --accent2:#B98A52;
    --accent-soft:color-mix(in srgb, var(--accent) 12%, white);
    --danger:#B42318; --ok:#166534;
    --r:6px;
    --font-h:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
    --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh}
  h1,h2,h3{font-family:var(--font-h);margin:0;line-height:1.15;font-weight:700}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  #app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

  /* Encabezado */
  .top{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .top .name{font-family:var(--font-h);font-size:20px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .sub{font-size:12.5px;opacity:.75}
  .top svg{flex:none}

  main{flex:1;padding:16px 16px calc(88px + env(safe-area-inset-bottom,0px))}
  .page-title{font-size:26px;margin-bottom:4px}
  .page-sub{color:var(--muted);font-size:14px;margin:0 0 16px}

  /* Barra inferior */
  .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
  .tab{flex:1;background:none;border:0;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--muted);cursor:pointer;min-height:56px;font-weight:500}
  .tab svg{width:24px;height:24px}
  .tab[aria-current="page"]{color:var(--accent);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}

  /* Botones */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r);border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
  .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
  .btn.block{width:100%}
  .btn.sm{min-height:38px;padding:0 12px;font-size:14px}
  .btn[disabled]{opacity:.55;cursor:not-allowed}

  /* Campos */
  .field{margin-bottom:14px}
  .field label,.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
  .hint{font-size:13px;color:var(--muted);margin-top:4px}
  input[type=text],input[type=email],input[type=password],input[type=tel],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;font-size:16px}
  textarea{min-height:84px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .err{color:var(--danger);font-size:14px;margin:8px 0 0;min-height:1em}

  /* Lista de clientes */
  .search{position:relative;margin-bottom:12px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
  .search input{padding-left:40px}
  .count{font-size:13px;color:var(--muted);margin:0 0 6px}
  .list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:0}
  .tile{flex:none;width:42px;height:42px;border-radius:4px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-h);font-weight:700;font-size:17px;border:1.5px solid color-mix(in srgb, var(--accent) 35%, white)}
  .row .main{min-width:0;flex:1}
  .row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ln{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{display:inline-block;font-size:12.5px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink);margin-top:4px}
  .empty{text-align:center;padding:36px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
  .empty h3{font-size:20px;margin-bottom:6px}
  .empty p{color:var(--muted);margin:0 0 16px}

  .fab{position:fixed;right:max(16px, calc(50% - 280px + 16px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:var(--r);border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:15}
  .fab svg{width:26px;height:26px}

  /* Hoja inferior */
  .veil{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:40}
  .sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;z-index:50;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px))}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .sheet-head h2{font-size:22px}
  .x{width:40px;height:40px;border-radius:var(--r);border:1.5px solid var(--line);background:none;cursor:pointer;font-size:18px}
  .inline-new{display:flex;gap:8px;margin-top:8px}
  .inline-new input{flex:1}

  /* Ajustes */
  .block-s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
  .block-s h2{font-size:20px;margin-bottom:4px}
  .block-s > p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .preset{border:2px solid var(--line);background:#fff;border-radius:var(--r);padding:10px 8px;cursor:pointer;text-align:center}
  .preset[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .preset .nm{font-weight:600;font-size:14.5px;margin-top:6px}
  .preset .ds{font-size:12px;color:var(--muted);line-height:1.25}
  .plan{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:54px;margin:0 auto}
  .plan i{display:block;aspect-ratio:1;border-radius:2px}
  .colorrow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .colorrow input[type=color]{width:52px;height:44px;padding:2px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff}
  .canal-row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .canal-row input[type=text]{flex:1}
  .sw{position:relative;width:50px;height:30px;flex:none}
  .sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
  .sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
  .sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .sw input:checked + span{background:var(--accent)}
  .sw input:checked + span::after{transform:translateX(20px)}
  .sw input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
  .off{opacity:.55}
  .ver{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}

  /* Acceso */
  .auth{padding:calc(40px + env(safe-area-inset-top,0px)) 20px 40px;max-width:420px;margin:0 auto;width:100%}
  .auth h1{font-size:34px;margin:14px 0 6px}
  .auth .lead{color:var(--muted);margin:0 0 22px}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px;background:#fff}
  .seg button{flex:1;min-height:44px;background:none;border:0;cursor:pointer;font-weight:600;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .note{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14.5px;margin-bottom:14px}

  #toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r);font-size:14.5px;z-index:80;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.on{opacity:1}
  .center{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';

/* ───────── CONFIGURACIÓN (única fuente) ───────── */
const APP_VERSION = 'v0.1.0';
const SUPABASE_URL = 'https://feagurtfealxvqnxyiub.supabase.co';
// Pega aquí la llave PÚBLICA (Publishable key, empieza con sb_publishable_). Nunca la "secret".
const SUPABASE_KEY = 'sb_publishable_qsaKcHDk0HemiRRiMQtmIg_Hvytz4Bv';
const ZONA = 'America/Mexico_City';

/* ───────── PALETAS (se pueden cambiar después en Ajustes) ───────── */
const PRESETS = {
  taller:   { nombre:'Taller',   desc:'Grafito y naranja de seguridad',
              vars:{'--bg':'#EDEFF1','--surface':'#FFFFFF','--ink':'#1C2228','--muted':'#566170','--line':'#D5DAE0','--accent':'#C2410C','--accent-ink':'#FFFFFF','--accent2':'#B98A52'} },
  plano:    { nombre:'Plano',    desc:'Azul de plano técnico',
              vars:{'--bg':'#EEF3F8','--surface':'#FFFFFF','--ink':'#0A2342','--muted':'#4F6179','--line':'#CBD7E5','--accent':'#1A5FD0','--accent-ink':'#FFFFFF','--accent2':'#7FA6D6'} },
  pabellon: { nombre:'Pabellón', desc:'Verde azulado y ámbar',
              vars:{'--bg':'#EFF3F2','--surface':'#FFFFFF','--ink':'#12302F','--muted':'#4D6B69','--line':'#CFDBD9','--accent':'#0B7A6F','--accent-ink':'#FFFFFF','--accent2':'#E3A82B'} }
};

/* ───────── UTILIDADES ───────── */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iniciales = n => (String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('') || '?').toUpperCase();
const fechaMX = iso => iso ? new Date(iso).toLocaleDateString('es-MX',{timeZone:ZONA,day:'numeric',month:'short',year:'numeric'}) : '';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600); }
function errMsg(e){
  const m = (e && (e.message||e.error_description)) || String(e||'Error desconocido');
  if (/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/already registered|already been registered/i.test(m)) return 'Ese correo ya tiene cuenta. Entra con tu contraseña.';
  if (/Email not confirmed/i.test(m)) return 'Confirma tu correo (revisa tu bandeja) y vuelve a entrar.';
  if (/at least 6|Password should/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
  if (/duplicate key|23505/i.test(m)) return 'Ya existe un registro con ese nombre.';
  if (/violates foreign key|23503/i.test(m)) return 'Tiene información ligada (presupuestos o stands); no se puede borrar.';
  if (/row-level security|permission denied/i.test(m)) return 'Tu rol no permite esta acción.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión. Revisa tu internet e intenta de nuevo.';
  return m;
}

/* Contraste de color (para que el texto sobre el acento se lea siempre) */
function lum(hex){ const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
function contraste(a,b){ const x=lum(a),y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
function tintaSobre(hex){ return contraste(hex,'#FFFFFF') >= contraste(hex,'#14181C') ? '#FFFFFF' : '#14181C'; }

function aplicarTema(t){
  t = t || {};
  const p = PRESETS[t.preset] || PRESETS.taller;
  const v = {...p.vars};
  if (t.acento && /^#[0-9a-f]{6}$/i.test(t.acento)) { v['--accent']=t.acento; v['--accent-ink']=tintaSobre(t.acento); }
  const st = document.documentElement.style;
  Object.entries(v).forEach(([k,val]) => st.setProperty(k,val));
  $('#meta-theme').setAttribute('content', v['--ink']);
  try { localStorage.setItem('stands_tema', JSON.stringify(t)); } catch(_){}
}
try { aplicarTema(JSON.parse(localStorage.getItem('stands_tema')||'{}')); } catch(_){ aplicarTema({}); }

/* ───────── ESTADO ───────── */
const S = { sb:null, user:null, perfil:null, empresa:null, canales:[], clientes:[], tab:'clientes', q:'', modo:'entrar' };
const puedeEditar = () => S.perfil && S.perfil.rol !== 'lectura';
const esAdmin = () => S.perfil && S.perfil.rol === 'admin';

/* ───────── ÍCONOS ───────── */
const IC = {
  mas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  lupa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  clientes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.9c1.7.7 2.8 2.3 3.1 5.1"/></svg>',
  ajustes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg>'
};
/* Marca: 3×3 módulos (el stand base de 3 × 3 m) con la esquina rellena */
function marca(size=28, colorRelleno='var(--accent)', colorLinea='rgba(255,255,255,.55)'){
  let g=''; for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    const lleno = (i===0||j===0);
    g += `<rect x="${1+j*8}" y="${1+i*8}" width="7" height="7" rx="1" ${lleno?`fill="${colorRelleno}"`:`fill="none" stroke="${colorLinea}" stroke-width="1.2"`}/>`;
  }
  return `<svg viewBox="0 0 26 26" width="${size}" height="${size}" aria-hidden="true">${g}</svg>`;
}

/* ───────── ARRANQUE ───────── */
document.addEventListener('DOMContentLoaded', arrancar);
async function arrancar(){
  const app = $('#app');
  if (!window.supabase) { app.innerHTML = '<div class="center">No se pudo cargar la librería de acceso. Revisa tu conexión y recarga.</div>'; return; }
  if (SUPABASE_KEY.startsWith('PEGA_AQUI')) {
    app.innerHTML = `<div class="auth"><h1>Falta la llave pública</h1>
      <p class="lead">Abre este archivo y pega la <b>Publishable key</b> de tu proyecto en la constante <code>SUPABASE_KEY</code>. La encuentras en Supabase, dentro de tu proyecto, en el botón <b>Connect</b> o en Project Settings, sección API Keys. Usa la que empieza con <code>sb_publishable_</code>.</p></div>`;
    return;
  }
  S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  app.innerHTML = '<div class="center">Cargando…</div>';
  const { data } = await S.sb.auth.getSession();
  S.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { S.user=null; S.perfil=null; pintarAcceso(); } });
  if (data.session) { S.user = data.session.user; await cargarContexto(); } else { pintarAcceso(); }
}

async function cargarContexto(){
  try {
    const { data:perfil, error:e1 } = await S.sb.from('perfiles').select('*').eq('id', S.user.id).maybeSingle();
    if (e1) throw e1;
    if (!perfil) { pintarCrearEmpresa(); return; }
    S.perfil = perfil;
    const [emp, can, cli] = await Promise.all([
      S.sb.from('empresas').select('*').maybeSingle(),
      S.sb.from('canales_origen').select('*').order('orden').order('nombre'),
      S.sb.from('clientes').select('*').order('creado_en',{ascending:false})
    ]);
    for (const r of [emp,can,cli]) if (r.error) throw r.error;
    S.empresa = emp.data; S.canales = can.data || []; S.clientes = cli.data || [];
    aplicarTema(S.empresa && S.empresa.tema);
    pintarShell();
  } catch(e){
    $('#app').innerHTML = `<div class="auth"><h1>No se pudo cargar</h1><p class="lead">${esc(errMsg(e))}</p><button class="btn block" id="reint">Reintentar</button></div>`;
    $('#reint').onclick = () => cargarContexto();
  }
}

/* ───────── ACCESO ───────── */
function pintarAcceso(){
  const entrar = S.modo === 'entrar';
  $('#app').innerHTML = `
  <div class="auth">
    ${marca(44,'var(--accent)','var(--muted)')}
    <h1>Stands</h1>
    <p class="lead">Clientes, fabricación y montaje de tus stands, desde el celular.</p>
    <div class="seg" role="group" aria-label="Modo">
      <button type="button" data-m="entrar" aria-pressed="${entrar}">Entrar</button>
      <button type="button" data-m="crear" aria-pressed="${!entrar}">Crear cuenta</button>
    </div>
    <div class="field"><label for="a-mail">Correo</label><input id="a-mail" type="email" autocomplete="email" inputmode="email"></div>
    <div class="field"><label for="a-pass">Contraseña</label><input id="a-pass" type="password" autocomplete="${entrar?'current-password':'new-password'}"><div class="hint">${entrar?'':'Mínimo 6 caracteres.'}</div></div>
    <button class="btn block" id="a-go">${entrar?'Entrar':'Crear cuenta'}</button>
    <p class="err" id="a-err" role="alert"></p>
  </div>`;
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { S.modo = b.dataset.m; pintarAcceso(); });
  $('#a-go').onclick = enviarAcceso;
  $('#a-pass').addEventListener('keydown', e => { if (e.key==='Enter') enviarAcceso(); });
}

async function enviarAcceso(){
  const email = $('#a-mail').value.trim(), password = $('#a-pass').value, err = $('#a-err'), btn = $('#a-go');
  err.textContent = '';
  if (!email || !password) { err.textContent = 'Escribe tu correo y tu contraseña.'; return; }
  btn.disabled = true;
  try {
    if (S.modo === 'entrar') {
      const { data, error } = await S.sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      S.user = data.user; await cargarContexto();
    } else {
      const { data, error } = await S.sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session) { S.user = data.user; await cargarContexto(); }
      else { $('#app').innerHTML = `<div class="auth"><h1>Revisa tu correo</h1><p class="lead">Te enviamos un enlace para confirmar tu cuenta. Después de confirmarlo, entra aquí con tu correo y contraseña.</p><button class="btn block" id="v">Volver a entrar</button></div>`; $('#v').onclick = () => { S.modo='entrar'; pintarAcceso(); }; }
    }
  } catch(e){ err.textContent = errMsg(e); btn.disabled = false; }
}

function pintarCrearEmpresa(){
  $('#app').innerHTML = `
  <div class="auth">
    ${marca(44,'var(--accent)','var(--muted)')}
    <h1>Tu empresa</h1>
    <p class="lead">Escribe el nombre con el que quieres identificar tu taller o empresa. Lo puedes cambiar después.</p>
    <div class="field"><label for="e-nom">Nombre de la empresa</label><input id="e-nom" type="text" autocomplete="organization"></div>
    <button class="btn block" id="e-go">Crear empresa</button>
    <p class="err" id="e-err" role="alert"></p>
    <button class="btn plain block" id="e-out" style="margin-top:10px">Cerrar sesión</button>
  </div>`;
  $('#e-out').onclick = cerrarSesion;
  $('#e-go').onclick = async () => {
    const nombre = $('#e-nom').value.trim(), err = $('#e-err'), btn = $('#e-go');
    if (!nombre) { err.textContent = 'Escribe el nombre de la empresa.'; return; }
    btn.disabled = true; err.textContent = '';
    const { error } = await S.sb.rpc('crear_empresa', { p_nombre: nombre });
    if (error) { err.textContent = errMsg(error); btn.disabled = false; return; }
    await cargarContexto();
  };
}

async function cerrarSesion(){ await S.sb.auth.signOut(); S.modo='entrar'; pintarAcceso(); }

/* ───────── CASCARÓN ───────── */
function pintarShell(){
  $('#app').innerHTML = `
    <header class="top">${marca(28)}<div style="min-width:0"><div class="name">${esc(S.empresa?.nombre||'Stands')}</div></div></header>
    <main id="vista"></main>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab" data-t="clientes">${IC.clientes}<span>Clientes</span></button>
      <button class="tab" data-t="ajustes">${IC.ajustes}<span>Ajustes</span></button>
    </nav>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; pintarVista(); });
  pintarVista();
}
function pintarVista(){
  document.querySelectorAll('.tab').forEach(b => { if (b.dataset.t===S.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  document.querySelectorAll('.fab').forEach(f => f.remove());
  window.scrollTo(0,0);
  if (S.tab === 'clientes') pintarClientes(); else pintarAjustes();
}

/* ───────── CLIENTES ───────── */
const nombreCanal = id => (S.canales.find(c => c.id===id) || {}).nombre || '';

function pintarClientes(){
  const v = $('#vista');
  v.innerHTML = `
    <h1 class="page-title">Clientes</h1>
    <p class="page-sub">Quién te contrata y de dónde llegó.</p>
    <div class="search">${IC.lupa}<input type="search" id="c-q" placeholder="Buscar cliente" value="${esc(S.q)}" aria-label="Buscar clientes"></div>
    <div id="c-lista"></div>`;
  $('#c-q').addEventListener('input', e => { S.q = e.target.value; listaClientes(); });
  if (puedeEditar()) {
    const f = document.createElement('button'); f.className='fab'; f.setAttribute('aria-label','Nuevo cliente'); f.innerHTML=IC.mas; f.onclick=()=>formCliente(null);
    document.body.appendChild(f);
  }
  listaClientes();
}

function listaClientes(){
  const q = S.q.trim().toLowerCase();
  const items = S.clientes.filter(c => !q || [c.nombre,c.empresa_cliente,c.telefono,c.correo,nombreCanal(c.canal_id)].some(x => String(x||'').toLowerCase().includes(q)));
  const box = $('#c-lista');
  if (!S.clientes.length) {
    box.innerHTML = `<div class="empty"><h3>Aún no hay clientes</h3><p>Registra al primero y anota de qué canal llegó.</p>${puedeEditar()?'<button class="btn" id="c-nuevo">Agregar cliente</button>':''}</div>`;
    const b = $('#c-nuevo'); if (b) b.onclick = () => formCliente(null);
    return;
  }
  if (!items.length) { box.innerHTML = '<div class="empty"><h3>Sin resultados</h3><p>Prueba con otro nombre o canal.</p></div>'; return; }
  box.innerHTML = `<p class="count">${items.length} de ${S.clientes.length}</p><div class="list">` + items.map(c => `
    <button class="row" data-id="${esc(c.id)}">
      <span class="tile">${esc(iniciales(c.nombre))}</span>
      <span class="main">
        <div class="nm">${esc(c.nombre)}</div>
        <div class="ln">${esc([c.empresa_cliente,c.cargo].filter(Boolean).join(' · ') || c.telefono || 'Sin más datos')}</div>
        ${nombreCanal(c.canal_id)?`<span class="chip">${esc(nombreCanal(c.canal_id))}</span>`:''}
      </span>
    </button>`).join('') + '</div>';
  box.querySelectorAll('.row').forEach(r => r.onclick = () => formCliente(S.clientes.find(c => c.id===r.dataset.id)));
}

function opcionesCanal(sel){
  const act = S.canales.filter(c => c.activo || c.id===sel);
  return '<option value="">Elige un canal…</option>' + act.map(c => `<option value="${esc(c.id)}" ${c.id===sel?'selected':''}>${esc(c.nombre)}${c.activo?'':' (inactivo)'}</option>`).join('') + (puedeEditar()?'<option value="__nuevo">＋ Agregar otro canal…</option>':'');
}

function formCliente(c){
  const edit = !!c, ro = !puedeEditar();
  const can = 'contacts' in navigator && 'ContactsManager' in window;
  abrirHoja(`
    <div class="sheet-head"><h2>${edit?'Cliente':'Nuevo cliente'}</h2><button class="x" aria-label="Cerrar" id="h-x">✕</button></div>
    ${can && !ro ? '<button class="btn ghost block sm" id="f-contactos" style="margin-bottom:14px">Importar de mis contactos</button>' : ''}
    <div class="field"><label for="f-canal">¿De dónde llegó? *</label><select id="f-canal" ${ro?'disabled':''}>${opcionesCanal(c?.canal_id)}</select>
      <div id="f-canal-nuevo" hidden class="inline-new"><input type="text" id="f-canal-txt" placeholder="Nombre del canal" aria-label="Nombre del nuevo canal"><button class="btn sm" id="f-canal-ok" type="button">Agregar</button></div></div>
    <div class="field"><label for="f-nombre">Nombre *</label><input type="text" id="f-nombre" value="${esc(c?.nombre)}" autocomplete="off" ${ro?'disabled':''}></div>
    <div class="field"><label for="f-tel">Teléfono</label><input type="tel" id="f-tel" value="${esc(c?.telefono)}" inputmode="tel" ${ro?'disabled':''}></div>
    <div class="field"><label for="f-mail">Correo</label><input type="email" id="f-mail" value="${esc(c?.correo)}" inputmode="email" ${ro?'disabled':''}></div>
    <div class="field"><label for="f-emp">Empresa del cliente</label><input type="text" id="f-emp" value="${esc(c?.empresa_cliente)}" ${ro?'disabled':''}></div>
    <div class="field"><label for="f-cargo">Cargo</label><input type="text" id="f-cargo" value="${esc(c?.cargo)}" ${ro?'disabled':''}></div>
    <div class="field"><label for="f-dir">Dirección</label><input type="text" id="f-dir" value="${esc(c?.direccion)}" ${ro?'disabled':''}></div>
    <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" ${ro?'disabled':''}>${esc(c?.notas)}</textarea></div>
    <p class="err" id="f-err" role="alert"></p>
    ${ro ? '' : `<button class="btn block" id="f-ok">${edit?'Guardar cambios':'Guardar cliente'}</button>`}
    ${edit && !ro ? '<button class="btn danger block" id="f-del" style="margin-top:10px">Eliminar cliente</button>' : ''}
  `);
  $('#h-x').onclick = cerrarHoja;
  const selC = $('#f-canal');
  selC.onchange = () => {
    const nuevo = selC.value === '__nuevo';
    $('#f-canal-nuevo').hidden = !nuevo;
    if (nuevo) $('#f-canal-txt').focus();
  };
  const okC = $('#f-canal-ok');
  if (okC) okC.onclick = async () => {
    const nombre = $('#f-canal-txt').value.trim();
    if (!nombre) return;
    const dup = S.canales.find(x => x.nombre.toLowerCase()===nombre.toLowerCase());
    if (dup) { selC.innerHTML = opcionesCanal(dup.id); $('#f-canal-nuevo').hidden = true; if(!dup.activo) toast('Ese canal estaba inactivo; actívalo en Ajustes.'); return; }
    const orden = (S.canales.reduce((m,x)=>Math.max(m,x.orden),0)) + 1;
    const { data, error } = await S.sb.from('canales_origen').insert({ nombre, orden }).select().single();
    if (error) { $('#f-err').textContent = errMsg(error); return; }
    S.canales.push(data); selC.innerHTML = opcionesCanal(data.id); $('#f-canal-nuevo').hidden = true; toast('Canal agregado');
  };
  const bc = $('#f-contactos');
  if (bc) bc.onclick = async () => {
    try {
      const r = await navigator.contacts.select(['name','tel','email'], { multiple:false });
      if (r && r[0]) { const p = r[0];
        if (p.name && p.name[0]) $('#f-nombre').value = p.name[0];
        if (p.tel && p.tel[0]) $('#f-tel').value = p.tel[0];
        if (p.email && p.email[0]) $('#f-mail').value = p.email[0]; }
    } catch(_){ /* el usuario canceló */ }
  };
  const ok = $('#f-ok'); if (ok) ok.onclick = () => guardarCliente(c);
  const del = $('#f-del'); if (del) del.onclick = () => borrarCliente(c);
}

async function guardarCliente(c){
  const v = id => $(id).value.trim() || null;
  const err = $('#f-err'); err.textContent = '';
  const canal_id = $('#f-canal').value;
  const nombre = $('#f-nombre').value.trim();
  if (!canal_id || canal_id==='__nuevo') { err.textContent = 'Elige de dónde llegó el cliente.'; return; }
  if (!nombre) { err.textContent = 'Escribe el nombre del cliente.'; return; }
  const datos = { nombre, canal_id, telefono:v('#f-tel'), correo:v('#f-mail'), empresa_cliente:v('#f-emp'), cargo:v('#f-cargo'), direccion:v('#f-dir'), notas:v('#f-notas') };
  const btn = $('#f-ok'); btn.disabled = true;
  const q = c ? S.sb.from('clientes').update(datos).eq('id', c.id).select().single() : S.sb.from('clientes').insert(datos).select().single();
  const { data, error } = await q;
  if (error) { err.textContent = errMsg(error); btn.disabled = false; return; }
  if (c) S.clientes = S.clientes.map(x => x.id===c.id ? data : x); else S.clientes.unshift(data);
  cerrarHoja(); listaClientes(); toast(c ? 'Cambios guardados' : 'Cliente guardado');
}

async function borrarCliente(c){
  if (!confirm(`¿Eliminar a ${c.nombre}? Esta acción no se puede deshacer.`)) return;
  const { error } = await S.sb.from('clientes').delete().eq('id', c.id);
  if (error) { $('#f-err').textContent = errMsg(error); return; }
  S.clientes = S.clientes.filter(x => x.id !== c.id);
  cerrarHoja(); listaClientes(); toast('Cliente eliminado');
}

/* ───────── HOJA INFERIOR ───────── */
let _foco = null;
function abrirHoja(html){
  _foco = document.activeElement;
  $('#layer').innerHTML = `<div class="veil" id="veil"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  $('#veil').onclick = cerrarHoja;
  document.body.style.overflow = 'hidden';
  const p = $('#layer input:not([type=hidden]), #layer select'); if (p) setTimeout(() => p.focus({preventScroll:true}), 30);
}
function cerrarHoja(){
  $('#layer').innerHTML = ''; document.body.style.overflow = '';
  if (_foco && _foco.focus) try { _foco.focus({preventScroll:true}); } catch(_){}
}
document.addEventListener('keydown', e => { if (e.key==='Escape' && $('#layer').innerHTML) cerrarHoja(); });

/* ───────── AJUSTES ───────── */
function miniPlano(p, acento){
  const v = p.vars, a = acento || v['--accent'];
  let s=''; for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    const lleno = (i===0||j===0);
    s += `<i style="background:${lleno?a:v['--bg']};border:1.5px solid ${lleno?a:v['--line']}"></i>`;
  }
  return `<div class="plan" style="background:${v['--ink']};padding:4px;border-radius:4px;width:62px">${s}</div>`;
}

function pintarAjustes(){
  const t = S.empresa?.tema || {preset:'taller'}, adm = esAdmin();
  const e = S.empresa || {};
  const acentoActual = t.acento || (PRESETS[t.preset]||PRESETS.taller).vars['--accent'];
  $('#vista').innerHTML = `
    <h1 class="page-title">Ajustes</h1>
    <p class="page-sub">${adm ? 'Personaliza tu empresa.' : 'Solo el administrador puede cambiar estos ajustes.'}</p>

    <section class="block-s" aria-labelledby="s-ap">
      <h2 id="s-ap">Apariencia</h2>
      <p>Elige una paleta. Puedes cambiarla cuando quieras.</p>
      <div class="presets" role="radiogroup" aria-label="Paleta de colores">
        ${Object.entries(PRESETS).map(([k,p]) => `
          <button class="preset" role="radio" aria-checked="${(t.preset||'taller')===k}" data-p="${k}" ${adm?'':'disabled'}>
            ${miniPlano(p, (t.preset||'taller')===k ? t.acento : null)}
            <div class="nm">${esc(p.nombre)}</div><div class="ds">${esc(p.desc)}</div>
          </button>`).join('')}
      </div>
      <div class="colorrow">
        <label for="s-acento" class="lbl" style="margin:0">Color de acento propio</label>
        <input type="color" id="s-acento" value="${esc(acentoActual)}" ${adm?'':'disabled'}>
        <button class="btn plain sm" id="s-reset" ${adm&&t.acento?'':'disabled'}>Quitar color propio</button>
      </div>
      <p class="hint" id="s-aviso"></p>
    </section>

    <section class="block-s" aria-labelledby="s-ca">
      <h2 id="s-ca">Canales de origen</h2>
      <p>Las opciones que aparecen al registrar un cliente. Si desactivas uno, deja de ofrecerse pero se conserva en los clientes que ya lo tienen.</p>
      <div id="s-canales"></div>
      ${puedeEditar() ? '<div class="inline-new"><input type="text" id="s-canal-nuevo" placeholder="Nuevo canal (ej. Instagram)" aria-label="Nuevo canal"><button class="btn sm" id="s-canal-add">Agregar</button></div><p class="err" id="s-canal-err" role="alert"></p>' : ''}
    </section>

    <section class="block-s" aria-labelledby="s-em">
      <h2 id="s-em">Datos de la empresa</h2>
      <p>Aparecerán en tus presupuestos y recibos.</p>
      <div class="field"><label for="s-nom">Nombre</label><input type="text" id="s-nom" value="${esc(e.nombre)}" ${adm?'':'disabled'}></div>
      <div class="field"><label for="s-rs">Razón social</label><input type="text" id="s-rs" value="${esc(e.razon_social)}" ${adm?'':'disabled'}></div>
      <div class="field"><label for="s-rfc">RFC</label><input type="text" id="s-rfc" value="${esc(e.rfc)}" autocapitalize="characters" ${adm?'':'disabled'}></div>
      <div class="field"><label for="s-dir">Dirección</label><input type="text" id="s-dir" value="${esc(e.direccion)}" ${adm?'':'disabled'}></div>
      ${adm ? '<button class="btn block" id="s-emp-ok">Guardar datos</button><p class="err" id="s-emp-err" role="alert"></p>' : ''}
    </section>

    <section class="block-s" aria-labelledby="s-cu">
      <h2 id="s-cu">Cuenta</h2>
      <p>${esc(S.user?.email||'')} · rol: ${esc(S.perfil?.rol||'')}</p>
      <button class="btn plain block" id="s-out">Cerrar sesión</button>
    </section>
    <p class="ver">Stands ${esc(APP_VERSION)}</p>`;

  document.querySelectorAll('.preset').forEach(b => b.onclick = () => guardarTema({ preset:b.dataset.p, acento:S.empresa.tema?.acento }));
  const ac = $('#s-acento');
  ac.addEventListener('input', () => avisoContraste(ac.value));
  ac.addEventListener('change', () => guardarTema({ preset:(S.empresa.tema?.preset||'taller'), acento:ac.value }));
  $('#s-reset').onclick = () => guardarTema({ preset:(S.empresa.tema?.preset||'taller') });
  avisoContraste(acentoActual);
  pintarCanalesAjustes();
  const add = $('#s-canal-add'); if (add) add.onclick = agregarCanalAjustes;
  const eok = $('#s-emp-ok'); if (eok) eok.onclick = guardarEmpresa;
  $('#s-out').onclick = cerrarSesion;
}

function avisoContraste(hex){
  const el = $('#s-aviso'); if (!el) return;
  const c = contraste(hex, '#FFFFFF');
  el.textContent = c < 3 ? 'Este color se lee poco sobre fondo blanco (enlaces y detalles). Prueba uno más oscuro.' : '';
}

async function guardarTema(tema){
  const limpio = { preset: tema.preset || 'taller' }; if (tema.acento) limpio.acento = tema.acento;
  const { error } = await S.sb.from('empresas').update({ tema: limpio }).eq('id', S.empresa.id);
  if (error) { toast(errMsg(error)); return; }
  S.empresa.tema = limpio; aplicarTema(limpio); pintarAjustes(); toast('Apariencia guardada');
}

function pintarCanalesAjustes(){
  const ed = puedeEditar();
  $('#s-canales').innerHTML = S.canales.map(c => `
    <div class="canal-row ${c.activo?'':'off'}" data-id="${esc(c.id)}">
      <input type="text" value="${esc(c.nombre)}" aria-label="Nombre del canal" ${ed?'':'disabled'}>
      <label class="sw" title="${c.activo?'Activo':'Inactivo'}"><input type="checkbox" ${c.activo?'checked':''} ${ed?'':'disabled'} aria-label="Canal activo"><span></span></label>
    </div>`).join('') || '<p class="hint">Todavía no hay canales.</p>';
  document.querySelectorAll('#s-canales .canal-row').forEach(row => {
    const id = row.dataset.id, txt = row.querySelector('input[type=text]'), sw = row.querySelector('input[type=checkbox]');
    txt.addEventListener('change', async () => {
      const c = S.canales.find(x => x.id===id), nombre = txt.value.trim();
      if (!nombre) { txt.value = c.nombre; return; }
      if (nombre === c.nombre) return;
      const { error } = await S.sb.from('canales_origen').update({ nombre }).eq('id', id);
      if (error) { txt.value = c.nombre; toast(errMsg(error)); return; }
      c.nombre = nombre; toast('Canal renombrado');
    });
    sw.addEventListener('change', async () => {
      const c = S.canales.find(x => x.id===id);
      const { error } = await S.sb.from('canales_origen').update({ activo: sw.checked }).eq('id', id);
      if (error) { sw.checked = c.activo; toast(errMsg(error)); return; }
      c.activo = sw.checked; row.classList.toggle('off', !c.activo);
    });
  });
}

async function agregarCanalAjustes(){
  const inp = $('#s-canal-nuevo'), err = $('#s-canal-err'), nombre = inp.value.trim(); err.textContent = '';
  if (!nombre) return;
  const orden = S.canales.reduce((m,x)=>Math.max(m,x.orden),0) + 1;
  const { data, error } = await S.sb.from('canales_origen').insert({ nombre, orden }).select().single();
  if (error) { err.textContent = errMsg(error); return; }
  S.canales.push(data); inp.value = ''; pintarCanalesAjustes(); toast('Canal agregado');
}

async function guardarEmpresa(){
  const v = id => $(id).value.trim() || null, err = $('#s-emp-err'); err.textContent = '';
  const nombre = $('#s-nom').value.trim();
  if (!nombre) { err.textContent = 'El nombre no puede quedar vacío.'; return; }
  const datos = { nombre, razon_social:v('#s-rs'), rfc:v('#s-rfc') ? v('#s-rfc').toUpperCase() : null, direccion:v('#s-dir') };
  const { data, error } = await S.sb.from('empresas').update(datos).eq('id', S.empresa.id).select().single();
  if (error) { err.textContent = errMsg(error); return; }
  S.empresa = data; const n = $('.top .name'); if (n) n.textContent = data.nombre; toast('Datos guardados');
}
</script>
